*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
html,body{height:100%;margin:0;background:#fff;color:#1b1720;
  font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Serif SC','Songti SC','Microsoft YaHei',serif;
  overscroll-behavior:none}
body{overflow:hidden}
#app{position:fixed;inset:0;overflow:hidden}

.screen{position:absolute;inset:0;opacity:0;pointer-events:none;
  transition:opacity .5s ease, transform .5s cubic-bezier(.22,.61,.36,1);
  transform:scale(1.012);overflow:hidden}
.screen.active{opacity:1;pointer-events:auto;transform:none}

/* ================= 1. 封面（原海报） ================= */
#s-cover{background:radial-gradient(90% 60% at 50% 18%,#fffdfe,#f7eef4 62%,#f2e9f1);
  display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;
  padding:calc(env(safe-area-inset-top) + 14px) 0 calc(env(safe-area-inset-bottom) + 10px)}
.poster-box{position:relative;overflow:hidden;flex:0 0 auto;
  box-shadow:0 26px 60px rgba(120,90,130,.26), 0 4px 14px rgba(120,90,130,.14);
  animation:float 11s ease-in-out infinite}
@keyframes float{0%,100%{transform:scale(1)}50%{transform:scale(1.008)}}
.poster-box img{display:block;width:100%;height:auto}
.poster-box::after{content:'';position:absolute;inset:-40% -60%;
  background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.5) 50%,transparent 60%);
  transform:translateX(-60%);animation:sweep 7.5s 1.2s ease-in-out infinite;pointer-events:none}
@keyframes sweep{0%{transform:translateX(-60%)}42%,100%{transform:translateX(60%)}}

.tap{flex:0 0 auto;margin-top:calc(env(safe-area-inset-bottom) + 16px);text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:6px}
.tap .chev{display:block;width:9px;height:9px;border-right:1px solid #b09ab6;border-bottom:1px solid #b09ab6;
  transform:rotate(45deg);animation:nudge 1.9s ease-in-out infinite;margin-bottom:2px}
@keyframes nudge{0%,100%{transform:rotate(45deg) translate(0,0);opacity:.5}50%{transform:rotate(45deg) translate(2px,2px);opacity:1}}
.tap b{font-weight:400;font-size:12.5px;letter-spacing:.30em;color:#5d5367;padding-left:.30em}
.tap i{font-style:normal;font-family:'Jost',sans-serif;font-size:9px;letter-spacing:.34em;color:#b3a7bd;padding-left:.34em}

/* ================= 封面 → 填写：向前翻页 ================= */
.flip{position:fixed;inset:0;pointer-events:none;z-index:40;display:none;perspective:1500px}
.flip.on{display:block}

#curl{position:absolute;inset:0;width:100%;height:100%;display:block}
.page{position:absolute;transform-origin:0% 50%;will-change:transform;display:none;
  background-repeat:no-repeat;background-size:100% 100%;background-color:#fff;
  box-shadow:18px 10px 46px rgba(86,60,100,.20)}
.page .sh{position:absolute;inset:0;pointer-events:none;opacity:0;
  background:linear-gradient(90deg,rgba(38,20,46,.46) 0%,rgba(38,20,46,.14) 26%,rgba(38,20,46,0) 58%)}
.page .hi{position:absolute;inset:0;pointer-events:none;opacity:0;
  background:linear-gradient(90deg,rgba(255,255,255,0) 46%,rgba(255,255,255,.55) 66%,rgba(255,255,255,0) 84%)}

.cast{position:absolute;inset:0;pointer-events:none;opacity:0}
.spine{position:absolute;top:0;bottom:0;width:30px;pointer-events:none;opacity:0;
  background:linear-gradient(90deg,rgba(38,20,46,.42),rgba(38,20,46,0))}

/* ================= 2. 填写 ================= */
#s-form{background:#fffdfe url(a/bg.jpg) center/cover no-repeat}
.form-wrap{position:relative;height:100%;display:flex;flex-direction:column;
  justify-content:center;
  padding:calc(env(safe-area-inset-top) + 12px) 22px calc(env(safe-area-inset-bottom) + 18px)}
.back{position:absolute;left:22px;top:calc(env(safe-area-inset-top) + 14px);background:none;border:0;padding:8px 6px 8px 0;color:#7b6f88;
  font-size:13px;letter-spacing:.06em;cursor:pointer;display:flex;align-items:center;gap:5px}
.back::before{content:'';width:7px;height:7px;border-left:1px solid currentColor;border-bottom:1px solid currentColor;
  transform:rotate(45deg)}
.fhead{text-align:center;margin:10px 0 0;opacity:0;transform:translateY(16px);
  transition:opacity .6s cubic-bezier(.2,.7,.2,1) .06s, transform .6s cubic-bezier(.2,.7,.2,1) .06s}
#s-form.active .fhead{opacity:1;transform:none}
.fhead .kick{font-family:'Jost',sans-serif;font-weight:200;font-size:10px;letter-spacing:.44em;color:#9b8fa8;margin:0 0 4px .44em}
.fhead h2{font-family:'Italianno',cursive;font-weight:400;font-size:min(19vw,74px);line-height:.95;margin:0;color:#171219}
.fhead p{margin:8px 0 0;font-size:12.5px;color:#6f6579;letter-spacing:.04em}

.panel{margin-top:30px;background:#ffffff;
  opacity:0;transform:translateY(22px);
  transition:opacity .6s cubic-bezier(.2,.7,.2,1) .16s, transform .6s cubic-bezier(.2,.7,.2,1) .16s;
  border:1px solid rgba(120,96,132,.16);
  border-radius:24px;padding:18px 18px 16px;
  box-shadow:0 22px 54px rgba(140,110,140,.22), 0 2px 10px rgba(140,110,140,.10)}
#s-form.active .panel{opacity:1;transform:none}
.field{display:block;margin:0 0 12px}
.lab{display:block;font-family:'Jost',sans-serif;font-weight:300;font-size:11px;letter-spacing:.22em;
  color:#8d8497;margin:0 0 7px .2em;text-transform:uppercase}
input[type=text]{width:100%;height:52px;border-radius:14px;border:1px solid rgba(60,45,70,.14);
  background:rgba(255,255,255,.94);padding:0 15px;font-size:16px;color:#1b1720;outline:none;
  font-family:inherit;transition:border-color .2s,box-shadow .2s}
input[type=text]::placeholder{color:#b6adbf}
input[type=text]:focus{border-color:rgba(190,140,175,.75);box-shadow:0 0 0 4px rgba(240,200,225,.35)}

.upload{display:flex;align-items:center;gap:12px;width:100%;padding:10px;border-radius:14px;
  border:1px dashed rgba(60,45,70,.22);background:rgba(255,255,255,.62);cursor:pointer;
  text-align:left;font-family:inherit;transition:.2s}
.upload:active{transform:scale(.99)}
.upload.has{border-style:solid;border-color:rgba(200,160,190,.7);background:#fff}
.thumb{width:46px;height:46px;border-radius:10px;flex:0 0 auto;overflow:hidden;

.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb::after{content:'＋';position:absolute;font-size:18px;color:#a99bb4}
.thumb.has::after{display:none}
.uptxt{display:flex;flex-direction:column;gap:3px}
.uptxt b{font-weight:500;font-size:14px;color:#2b2433}
.uptxt i{font-style:normal;font-size:11px;color:#9a90a5}

.cta{margin-top:14px;width:100%;height:52px;border:0;border-radius:16px;cursor:pointer;
  font-family:'Jost',sans-serif;font-weight:300;font-size:15px;letter-spacing:.24em;
  color:#fff;background:linear-gradient(120deg,#b98fae,#8f83bf 55%,#9aa6d8);
  box-shadow:0 12px 26px rgba(150,120,170,.32);transition:.25s;padding-left:.24em}
.cta:disabled{opacity:.42;box-shadow:none;filter:saturate(.6)}
.cta:not(:disabled):active{transform:translateY(1px) scale(.995)}
.tip{margin:10px 0 0;text-align:center;font-size:10.5px;color:#a49aad;letter-spacing:.04em}

/* ================= 3. 生成中 ================= */
#s-loading{display:grid;place-items:center;background:linear-gradient(180deg,#fdf6fa,#f1eefb)}
.spin{width:54px;height:54px;border-radius:50%;border:1px solid rgba(150,120,160,.22);
  border-top-color:#b58fb0;animation:sp 1s linear infinite;margin:0 auto 18px}
@keyframes sp{to{transform:rotate(360deg)}}
#s-loading p{font-size:13px;color:#6d6478;letter-spacing:.16em;text-align:center;margin:0}

/* ================= 4. 邀请函 ================= */
#s-card{display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 12px);
  background:radial-gradient(120% 80% at 50% 0%,#fdf7fa,#f3eefb 60%,#efe9f7)}
.card-area{position:relative;width:min(92vw,calc((100vh - 232px) * 0.6667));aspect-ratio:1080/1620}

/* 纸张投影（随展开加深） */
.card-shadow{position:absolute;left:3%;right:3%;top:4%;bottom:1%;border-radius:12px;
  box-shadow:0 34px 74px rgba(112,84,124,.30), 0 8px 20px rgba(112,84,124,.14);
  opacity:0}

/* 收尾星屑 */
.sparks{position:absolute;inset:0;pointer-events:none}
.spark{position:absolute;width:4px;height:4px;border-radius:50%;background:#fff;
  box-shadow:0 0 9px 2px rgba(255,242,220,.9)}

/* 展开时的光晕与扫光 */
.card-glow{position:absolute;inset:-18%;border-radius:50%;pointer-events:none;opacity:0;
  background:radial-gradient(closest-side,rgba(255,246,238,.95),rgba(255,238,248,.55) 42%,rgba(255,238,248,0) 72%)}
.sheen{position:absolute;inset:0;pointer-events:none;opacity:0;overflow:hidden;border-radius:4px}
.sheen-move{position:absolute;inset:-25% -70%;display:block;
  background:linear-gradient(105deg,transparent 32%,rgba(255,255,255,.55) 46%,rgba(255,255,255,.08) 57%,transparent 64%);
  transform:translateX(-130%)}

#card{position:absolute;inset:0;width:100%;height:100%;display:block;visibility:hidden}
#cardImg{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:4px;
  will-change:transform,opacity;-webkit-touch-callout:default}

.actions{display:flex;gap:10px;margin-top:18px;width:min(94vw,360px)}
.btn{flex:1;height:48px;border-radius:14px;border:0;cursor:pointer;font-family:'Jost',sans-serif;
  font-size:14px;letter-spacing:.16em;font-weight:300;padding-left:.16em}
.btn.primary{color:#fff;background:linear-gradient(120deg,#b98fae,#8f83bf 55%,#9aa6d8);
  box-shadow:0 12px 24px rgba(150,120,170,.30)}
.btn.ghost{color:#5c5368;background:rgba(255,255,255,.85);border:1px solid rgba(90,70,110,.14)}
.btn:active{transform:translateY(1px)}
.card-tip{margin:12px 0 0;font-size:11px;color:#9c92a6;letter-spacing:.06em}

/* ================= 星球建设进度入口 ================= */
/* 左侧边缘侧边栏把手 */
.progress-entry{position:fixed;left:0;top:50%;z-index:12;
  transform:translateY(-50%);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:9px;
  padding:16px 7px 15px;border:0;border-right:1px solid rgba(214,180,255,.35);
  border-top:1px solid rgba(214,180,255,.3);border-bottom:1px solid rgba(214,180,255,.3);
  border-radius:0 14px 14px 0;
  background:linear-gradient(180deg,rgba(58,34,80,.94),rgba(88,50,118,.92) 55%,rgba(64,38,92,.94));
  box-shadow:4px 6px 22px rgba(70,40,90,.34),inset -2px 0 8px rgba(255,220,255,.08);
  overflow:hidden;transition:transform .25s cubic-bezier(.22,.61,.36,1),box-shadow .25s}
.progress-entry:active{transform:translateY(-50%) translateX(3px)}
.progress-entry::after{content:'';position:absolute;inset:-60% -50%;
  background:linear-gradient(180deg,transparent 42%,rgba(255,255,255,.16) 50%,transparent 58%);
  transform:translateY(-60%);animation:peSweep 5s 1s ease-in-out infinite;pointer-events:none}
@keyframes peSweep{0%{transform:translateY(-60%)}45%,100%{transform:translateY(60%)}}
.pe-orb{font-size:17px;color:#f4dcff;filter:drop-shadow(0 0 8px rgba(220,160,255,.95));
  animation:orbPulse 2.6s ease-in-out infinite}
@keyframes orbPulse{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.2);opacity:1}}
.pe-txt{flex:0 0 auto;writing-mode:vertical-rl;text-orientation:upright;
  font-size:12px;letter-spacing:.22em;color:#fff;font-weight:400;line-height:1;white-space:nowrap}
.pe-txt i{display:none}
.pe-chev{font-size:16px;color:rgba(240,220,255,.8);line-height:1;transform:rotate(90deg)}

/* ================= 5. 星球建设进度页 ================= */
#s-planets{background:#0b0a1a;color:#fff}
.planet-bg{position:absolute;inset:0;background:url(a/pbg.jpg) center/cover no-repeat;
  transform:scale(1.04);animation:bgDrift 26s ease-in-out infinite alternate}
@keyframes bgDrift{0%{transform:scale(1.04) translate(0,0)}100%{transform:scale(1.1) translate(-1.5%,-1.5%)}}
.planet-bg::after{content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(10,8,26,.34),rgba(10,8,26,0) 26%,rgba(10,8,26,0) 70%,rgba(10,8,26,.5))}
.planet-stars{position:absolute;inset:0;pointer-events:none;opacity:.85}

.planet-view{position:absolute;inset:0;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 16px) 0 calc(env(safe-area-inset-bottom) + 24px);
  opacity:0;pointer-events:none;transition:opacity .5s ease}
.planet-view.on{opacity:1;pointer-events:auto}
.pv-head{position:relative;text-align:center;flex:0 0 auto;padding-top:30px}
.pv-back{position:absolute;left:14px;top:-2px;background:none;border:0;color:rgba(255,255,255,.82);
  font-size:12.5px;letter-spacing:.04em;cursor:pointer;padding:6px 8px;text-shadow:0 2px 10px rgba(0,0,0,.5);z-index:3}
.pv-head h2{margin:0;font-size:15px;font-weight:400;letter-spacing:.2em;
  color:rgba(255,255,255,.94);text-shadow:0 2px 14px rgba(0,0,0,.5)}

.carousel{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;
  touch-action:pan-y;cursor:grab}
.carousel:active{cursor:grabbing}
.track{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  will-change:transform}
.pitem{position:absolute;left:50%;top:50%;width:min(62vw,268px);aspect-ratio:1/1;
  margin:0;display:flex;align-items:center;justify-content:center;
  transition:transform .5s cubic-bezier(.22,.61,.36,1), opacity .5s ease, filter .5s ease;
  transform:translate(-50%,-50%) translateX(var(--x)) scale(var(--s));
  opacity:var(--o);filter:blur(var(--b)) brightness(var(--br));z-index:var(--z)}
.pitem .orb{position:relative;width:100%;height:100%;animation:hover 5.5s ease-in-out infinite;
  animation-delay:var(--dly)}
@keyframes hover{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-14px) rotate(2deg)}}
.pitem .orb img{position:relative;z-index:1;width:100%;height:100%;display:block;
  filter:saturate(var(--sat)) brightness(var(--brt))}
/* 柔光晕：纯径向渐变圆形发光（不会出现方形边缘） */
.pitem .orb .halo{position:absolute;inset:-32%;border-radius:50%;pointer-events:none;z-index:0;
  background:
    radial-gradient(closest-side,rgba(255,228,255,.85),rgba(240,190,255,.38) 34%,rgba(196,132,255,.14) 58%,transparent 74%);
  opacity:var(--halo);animation:haloPulse 3.4s ease-in-out infinite}
.pitem .orb .halo::after{content:'';position:absolute;inset:18%;border-radius:50%;
  background:radial-gradient(closest-side,rgba(255,255,255,.55),rgba(255,214,250,.22) 45%,transparent 70%)}
@keyframes haloPulse{0%,100%{transform:scale(1);opacity:var(--halo)}50%{transform:scale(1.08);opacity:calc(var(--halo) * 1.4)}}
.pitem .orb .ring{position:absolute;left:50%;top:50%;width:150%;height:78%;
  transform:translate(-50%,-50%) rotate(-16deg);opacity:var(--ring);pointer-events:none;
  background:url(a/pring.png) center/contain no-repeat;animation:ringSpin 22s linear infinite}
@keyframes ringSpin{0%{transform:translate(-50%,-50%) rotate(-16deg)}100%{transform:translate(-50%,-50%) rotate(344deg)}}
.pitem .lit-badge{position:absolute;top:6%;right:12%;font-family:'Jost',sans-serif;font-size:11px;
  letter-spacing:.14em;color:#fff;background:rgba(180,110,240,.42);border:1px solid rgba(255,255,255,.5);
  padding:3px 9px;border-radius:12px;opacity:var(--badge);transform:translateY(-4px);
  transition:opacity .4s,transform .4s;backdrop-filter:blur(6px)}

.pv-label{flex:0 0 auto;text-align:center;padding-top:2px}
.pv-name{font-family:'Cormorant Garamond','Jost',serif;font-style:italic;
  font-size:34px;letter-spacing:.04em;color:#fff;text-shadow:0 3px 20px rgba(0,0,0,.5);min-height:42px}
.pv-dots{display:flex;justify-content:center;gap:5px;margin-top:9px;flex-wrap:wrap;padding:0 16px}
.pv-dots i{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.3);transition:.3s}
.pv-dots i.on{background:#f0c9ff;box-shadow:0 0 8px rgba(230,170,255,.9);transform:scale(1.3)}
.pv-dots i.lit{background:#ffd9a8}

.pv-progress{flex:0 0 auto;padding:20px 30px 0}
.pv-progress .bar{height:15px;border-radius:9px;background:rgba(255,255,255,.14);
  border:1px solid rgba(255,255,255,.3);overflow:hidden;backdrop-filter:blur(6px);
  box-shadow:inset 0 1px 4px rgba(0,0,0,.2)}
.pv-progress .fill{height:100%;width:0%;border-radius:9px;
  background:linear-gradient(90deg,rgba(255,208,240,.95),rgba(236,170,255,.95),rgba(180,190,255,.95));
  box-shadow:0 0 16px rgba(240,180,255,.85);transition:width .6s cubic-bezier(.22,.61,.36,1)}
.pv-progress-cap{display:flex;justify-content:space-between;align-items:center;margin-top:9px;
  font-size:12px;letter-spacing:.16em;color:rgba(255,255,255,.72)}
.pv-progress-cap b{font-family:'Jost',sans-serif;font-weight:300;font-size:15px;letter-spacing:.06em;color:#fff}

/* 全部点亮：小星系 */
.galaxy{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .8s ease;
  display:flex;flex-direction:column;align-items:center;
  padding:calc(env(safe-area-inset-top) + 18px) 12px calc(env(safe-area-inset-bottom) + 18px);
  background:radial-gradient(ellipse 120% 78% at 50% 46%,rgba(16,12,40,.55) 0%,rgba(12,9,32,.80) 52%,rgba(8,6,24,.93) 100%)}
.galaxy.on{opacity:1;pointer-events:auto}
.galaxy-head{position:relative;text-align:center;flex:0 0 auto;width:100%;padding-top:30px}
.galaxy-head .pv-back{top:-2px}
.galaxy-head h2{margin:0;font-size:15px;font-weight:400;letter-spacing:.18em;text-shadow:0 2px 14px rgba(0,0,0,.5)}
.galaxy-head p{margin:7px 0 0;font-size:11.5px;letter-spacing:.12em;color:rgba(255,255,255,.72)}
.galaxy-stage{position:relative;flex:1 1 auto;width:100%;min-height:0;margin-top:6px;overflow:hidden}
#galaxyCanvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.galaxy-caption{flex:0 0 auto;text-align:center;padding:4px 20px 0;pointer-events:none}
.galaxy-caption b{display:block;font-family:'Cormorant Garamond',serif;font-style:italic;
  font-size:30px;font-weight:300;color:#fff;letter-spacing:.06em;line-height:1;
  text-shadow:0 0 22px rgba(255,190,255,.9),0 0 52px rgba(180,120,255,.7)}
.galaxy-caption span{display:block;margin-top:5px;font-family:'Jost',sans-serif;
  font-size:8.5px;letter-spacing:.4em;color:rgba(240,214,255,.78);padding-left:.4em}
.g-spark{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;
  box-shadow:0 0 6px rgba(255,255,255,.9);animation:twinkle var(--td) ease-in-out infinite;animation-delay:var(--dl)}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.6)}50%{opacity:1;transform:scale(1.4)}}

/* ================= 保存层 ================= */
.saver{position:fixed;inset:0;background:rgba(20,15,26,.985);display:none;z-index:50;
  flex-direction:column;align-items:center;justify-content:center;gap:16px;
  padding:calc(env(safe-area-inset-top) + 18px) 18px calc(env(safe-area-inset-bottom) + 18px)}
.saver.on{display:flex}
.saver img{max-width:84vw;max-height:62vh;border-radius:8px;flex:0 1 auto;
  box-shadow:0 24px 70px rgba(0,0,0,.55)}
.saver p{margin:0;color:#efe8f4;font-size:13px;letter-spacing:.10em;text-align:center;flex:0 0 auto}
.saver button{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.18);color:#fff;
  height:42px;padding:0 30px;border-radius:21px;font-size:13px;letter-spacing:.14em;flex:0 0 auto}

@media (max-height:700px){
  .fhead h2{font-size:min(16vw,58px)}
  .panel{padding:14px 16px 12px}
  input[type=text]{height:46px}
  .cta{height:48px;margin-top:10px}
  .tip{display:none}
  .tap{margin-top:10px}
}
</style>

<body>
<div id="app">

  <div class="flip" id="flip" aria-hidden="true">
    <div class="cast" id="cast"></div>
    <canvas id="curl"></canvas>
    <div class="page" id="page"><i class="sh"></i><i class="hi"></i></div>
    <div class="spine" id="spine"></div>
  </div>

  <section class="screen active" id="s-cover" role="button" aria-label="轻触开启邀请函">
    <div class="poster-box" id="posterBox"><img src="a/poster.jpg" alt="Invitation · NO.26 PLANET"></div>
    <div class="tap">
      <span class="chev"></span>
      <b>轻触开启邀请函</b>
      <i>TAP TO OPEN</i>
    </div>
  </section>

  <!-- ========== 2. 填写信息 ========== -->
  <section class="screen" id="s-form">
    <div class="form-wrap">
      <button class="back" id="back" type="button">返回封面</button>
      <div class="fhead">
        <p class="kick">845 UNIVERSE</p>
        <h2>Invitation</h2>
        <p>写下你的名字，领取一张通往 No.26 星球的邀请函</p>
      </div>
      <div class="panel">
        <label class="field">
          <span class="lab">Your name / ID</span>
          <input id="name" type="text" maxlength="14" placeholder="例如：小行星 845" autocomplete="off" spellcheck="false">
        </label>
        <button class="upload" id="pick" type="button">
          <span class="thumb" id="thumb"></span>
          <span class="uptxt"><b>上传应援图</b><i>会裁成方形，放进邀请函</i></span>
        </button>
        <input id="file" type="file" accept="image/*" hidden>
        <button class="cta" id="go" disabled>生成我的邀请函</button>
        <p class="tip">✦ 全程在本地生成，图片不会上传到任何服务器</p>
      </div>
    </div>
  </section>

  <!-- ========== 3. 生成中 ========== -->
  <section class="screen" id="s-loading">
    <div>
      <div class="spin"></div>
      <p>正在为你打包一颗小星球…</p>
    </div>
  </section>

  <!-- ========== 4. 邀请函 ========== -->
  <section class="screen" id="s-card">
    <div class="card-area" id="cardArea">
      <div class="card-glow" id="cardGlow"></div>
      <div class="card-shadow" id="cardShadow"></div>
      <canvas id="card"></canvas>
      <img id="cardImg" alt="SIWOO 26 邀请函">
      <div class="sparks" id="sparks"></div>
      <div class="sheen" id="sheen"><i class="sheen-move" id="sheenMove"></i></div>
    </div>
    <div class="actions">
      <button class="btn primary" id="save">保存图片</button>
      <button class="btn ghost" id="again">重新填写</button>
    </div>
    <button class="progress-entry" id="openPlanets" type="button">
      <span class="pe-orb">✦</span>
      <span class="pe-txt">845宇宙建设进度<i>查看星球点亮情况</i></span>
      <span class="pe-chev">›</span>
    </button>
    <p class="card-tip">长按图片也可保存 · 发给同好一起去 No.26 星球</p>
  </section>

  <!-- ========== 5. 星球建设进度 ========== -->
  <section class="screen" id="s-planets">
    <div class="planet-bg" id="planetBg"></div>
    <div class="planet-stars" id="planetStars"></div>

    <!-- 滑动选择视图 -->
    <div class="planet-view" id="planetView">
      <div class="pv-head">
        <button class="pv-back" id="planetBack" type="button">‹ 返回邀请函</button>
        <h2>请选择你想建设的星球</h2>
      </div>

      <div class="carousel" id="carousel">
        <div class="track" id="track"></div>
      </div>

      <div class="pv-label">
        <div class="pv-name" id="planetName">No.1</div>
        <div class="pv-dots" id="planetDots"></div>
      </div>

      <div class="pv-progress">
        <div class="bar"><div class="fill" id="progressFill"></div></div>
        <div class="pv-progress-cap">
          <span>星球建设进度</span>
          <b id="progressText">0%</b>
        </div>
      </div>
    </div>

    <!-- 全部点亮后的小星系 -->
    <div class="galaxy" id="galaxy">
      <div class="galaxy-head">
        <button class="pv-back" id="galaxyBack" type="button">‹ 返回邀请函</button>
        <h2>845 宇宙 · 已全部点亮</h2>
        <p>感谢你，和我们一起点亮了整片星系</p>
      </div>
      <div class="galaxy-stage" id="galaxyStage">
        <canvas id="galaxyCanvas"></canvas>
      </div>
      <div class="galaxy-caption"><b>845 UNIVERSE</b><span>ALL PLANETS LIT</span></div>
    </div>
  </section>

  <div class="saver" id="saver">
    <img id="savedImg" alt="邀请函">
    <p>长按图片 → 保存到相册</p>
    <button id="closeSaver">关闭</button>
  </div>
</div>

<script>
/* ===================== 资源 ===================== */
const SCENE_SRC = "a/scene.jpg";
const sceneImg = new Image();
let sceneReady = false;
sceneImg.onload = () => { sceneReady = true; };
sceneImg.src = SCENE_SRC;

/* ============ 星球建设进度：配置（由后台 planets.json 覆盖） ============ */
const PLANET_BG = "a/pbg.jpg", PLANET_IMG = "a/pplanet.png", PLANET_RING = "a/pring.png";
const DEFAULT_PLANETS = [100, 75, 100, 50, 25, 0, 50, 75, 25, 50, 0, 25, 50, 75, 25, 50, 0, 25, 50, 75, 25, 50, 0, 25, 50, 50];
let PLANETS = DEFAULT_PLANETS;

const $ = s => document.querySelector(s);
const clamp = (v,a,b) => Math.min(b,Math.max(a,v));

/* 海报显示尺寸：宽度不超出屏幕，高度留出提示区 */
function fitPoster(){
  const box = $('#posterBox');
  const vh = window.innerHeight, vw = window.innerWidth;
  const maxH = vh - 132 - (parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--safe-b')) || 0);
  const w = Math.min(vw, maxH * (1280/1920), 620);
  box.style.width = w + 'px';
  box.style.height = (w * 1920/1280) + 'px';
}
window.addEventListener('resize', fitPoster);

/* ===================== 状态 ===================== */
const state = { name:'', photo:null, photoURL:'' };

/* ===================== 屏幕切换 ===================== */
function show(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === id));
  /* 侧边栏把手只在邀请函卡片页与星球页显示 */
  $('#openPlanets').style.display = (id === 's-card' || id === 's-planets') ? 'flex' : 'none';

/* ===================== 邀请函绘制 ===================== */
const CW = 1080, CH = 1620;

function hash(str){
  let h = 2166136261;
  for (let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function serialOf(name){
  const h = hash(name);
  return {
    no: (h % 9000) + 1000,
    seat: 'ABCDEFGH'[h % 8] + '-' + String((h >>> 8) % 40 + 1).padStart(2,'0')
  };
}
function rr(g,x,y,w,h,r){
  g.beginPath();
  g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r);
  g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath();
}
function drawCover(g, src, x, y, w, h, r, sub){
  const sx = sub ? sub.x : 0, sy = sub ? sub.y : 0;
  const iw = sub ? sub.w : src.width, ih = sub ? sub.h : src.height;
  const s = Math.max(w/iw, h/ih);
  const dw = iw*s, dh = ih*s;
  g.save();
  rr(g,x,y,w,h,r); g.clip();
  g.drawImage(src, sx, sy, iw, ih, x + (w-dw)/2, y + (h-dh)/2, dw, dh);
  g.restore();
}
const DEFAULT_CROP = { x: 340, y: 340, w: 480, h: 480 };

function tracked(g, text, x, y, spacing, align){
  const chars = [...text];
  let total = 0;
  for (const c of chars) total += g.measureText(c).width + spacing;
  total -= spacing;
  let cx = align === 'center' ? x - total/2 : (align === 'right' ? x - total : x);
  for (const c of chars){ g.fillText(c, cx, y); cx += g.measureText(c).width + spacing; }
  return total;
}
function fitSize(g, text, family, weight, start, maxW, min){
  let size = start;
  while (size > min){
    g.font = `${weight} ${size}px ${family}`;
    if (g.measureText(text).width <= maxW) break;
    size -= 2;
  }
  return size;
}
function fog(g,x,y,r,col,a){
  const gr = g.createRadialGradient(x,y,0,x,y,r);
  gr.addColorStop(0,`rgba(${col},${a})`);
  gr.addColorStop(.45,`rgba(${col},${a*.42})`);
  gr.addColorStop(1,`rgba(${col},0)`);
  g.fillStyle = gr; g.beginPath(); g.arc(x,y,r,0,7); g.fill();
}

async function renderCard(){
  const cv = $('#card');
  cv.width = CW; cv.height = CH;
  const g = cv.getContext('2d');
  const idText = state.name || '无名星旅人';
  const { no, seat } = serialOf(idText);

  /* 底 */
  g.fillStyle = '#fffdfd'; g.fillRect(0,0,CW,CH);
  fog(g, 120, 120, 900, '255,226,238', .30);
  fog(g, 980, 1420, 900, '228,230,255', .28);
  fog(g, 540, 820, 900, '255,238,246', .16);

  /* 细边框 */
  g.strokeStyle = 'rgba(70,50,80,.13)'; g.lineWidth = 2;
  g.strokeRect(36, 36, CW-72, CH-72);

  /* 顶部 */
  g.fillStyle = '#171219'; g.textAlign = 'center'; g.textBaseline = 'alphabetic';
  g.font = '400 186px Italianno, cursive';
  g.fillText('Invitation', CW/2, 218);
  g.fillStyle = 'rgba(92,82,104,.82)';
  g.font = '200 21px Jost, sans-serif';
  tracked(g, 'NO.26 PLANET   ·   845 UNIVERSE', CW/2, 272, 8, 'center');

  /* 照片 */
  const pw = 566, ph = 566, px = (CW-pw)/2, py = 320;
  g.save();
  g.translate(px + pw/2, py + ph/2);
  g.rotate(-1.4 * Math.PI/180);
  g.globalCompositeOperation = 'screen';
  fog(g, 0, 0, 430, '255,236,246', .55);
  g.globalCompositeOperation = 'source-over';
  g.shadowColor = 'rgba(120,90,130,.26)'; g.shadowBlur = 44; g.shadowOffsetY = 20;
  g.fillStyle = '#fff'; rr(g, -pw/2-16, -ph/2-16, pw+32, ph+32, 16); g.fill();
  g.shadowColor = 'transparent'; g.shadowBlur = 0; g.shadowOffsetY = 0;
  const src = state.photo || (sceneReady ? sceneImg : null);
  if (src){
    drawCover(g, src, -pw/2, -ph/2, pw, ph, 8, state.photo ? null : DEFAULT_CROP);
  } else {
    g.fillStyle = '#f3e9f1'; rr(g, -pw/2,-ph/2,pw,ph,8); g.fill();
  }
  g.strokeStyle = 'rgba(70,50,80,.10)'; g.lineWidth = 1.5;
  rr(g, -pw/2, -ph/2, pw, ph, 8); g.stroke();
  g.restore();

  /* HELLO, —— 呼应海报 */
  g.textAlign = 'center';
  g.fillStyle = '#1f1f1f';
  g.font = '200 42px Jost, sans-serif';
  (function(){
    const sp = 13, word = 'HELLO';
    let w = 0;
    for (const c of word) w += g.measureText(c).width + sp;
    w -= sp;
    const commaW = g.measureText(',').width;
    let x = CW/2 - (w + 5 + commaW)/2;
    for (const c of word){ g.fillText(c, x, 1012); x += g.measureText(c).width + sp; }
    g.fillText(',', x - sp + 5, 1012);
  })();

  /* 名字 */
  const isLatin = /^[\x00-\x7F\s]*$/.test(idText);
  if (isLatin){
    const size = fitSize(g, idText, 'Italianno, cursive', '400', 118, 780, 54);
    g.font = `400 ${size}px Italianno, cursive`;
    g.fillStyle = '#141018';
    g.fillText(idText, CW/2, 1132);
  } else {
    const fam = '"Songti SC","Noto Serif SC","PingFang SC",serif';
    const size = fitSize(g, idText, fam, '400', 68, 780, 30);
    g.font = `400 ${size}px ${fam}`;
    g.fillStyle = '#141018';
    g.fillText(idText, CW/2, 1120);
  }

  /* 中文小句 */
  g.font = '300 27px "Songti SC","Noto Serif SC",serif';
  g.fillStyle = 'rgba(84,74,96,.92)';
  g.fillText('这颗星球为你留了位置，请一定来', CW/2, 1178);

  /* 信息栏 */
  const colX = [222, 566], rowY = [1256, 1326];
  const items = [
    ['SERIAL NO.', 'No.26-' + no],
    ['SEAT', '应援席 ' + seat],
    ['ROUTE', 'EARTH → NO.26'],
    ['VALID', 'FOREVER 永久']
  ];
  items.forEach((it, i) => {
    const x = colX[i % 2], y = rowY[Math.floor(i/2)];
    g.textAlign = 'left';
    g.fillStyle = 'rgba(150,140,164,.95)';
    g.font = '300 15px Jost, sans-serif';
    tracked(g, it[0], x, y, 3.4, 'left');
    g.fillStyle = 'rgba(38,32,46,.96)';
    g.font = '300 27px Jost, "Songti SC", sans-serif';
    g.fillText(it[1], x, y + 32);
  });

  g.strokeStyle = 'rgba(70,50,80,.13)'; g.lineWidth = 1;
  g.beginPath(); g.moveTo(200, 1386); g.lineTo(880, 1386); g.stroke();

  /* 条形码 */
  const bx = 200, by = 1456, bw = 236, bh = 42;
  const hh = hash(idText + '·bar');
  let cxp = bx;
  for (let i = 0; i < 44 && cxp < bx + bw; i++){
    const wd = ((hh >>> (i % 28)) & 3) + 1.2;
    if (i % 2 === 0){ g.fillStyle = 'rgba(40,34,48,.80)'; g.fillRect(cxp, by, wd, bh); }
    cxp += wd + 3.2;
  }
  g.fillStyle = 'rgba(126,116,138,.92)';
  g.font = '300 13px Jost, sans-serif';
  g.textAlign = 'left';
  tracked(g, 'ADMIT ONE  ·  NO.26-' + no, bx, by + bh + 24, 2.2, 'left');

  /* 右下签名 */
  g.textAlign = 'right';
  g.fillStyle = 'rgba(150,120,170,.92)';
  g.font = '400 52px Italianno, cursive';
  g.fillText('845', 880, 1490);
  g.font = '200 13px Jost, sans-serif';
  g.fillStyle = 'rgba(126,116,138,.92)';
  tracked(g, 'UNIVERSE', 880, 1514, 3.6, 'right');

  /* 底部小字 */
  g.textAlign = 'center';
  g.fillStyle = 'rgba(158,148,172,.95)';
  g.font = '300 18px "Songti SC","Noto Serif SC",serif';
  g.fillText('凭此函入场 · 仅限一人 · 请携一份偏爱', CW/2, 1574);
}

/* ===================== 封面 → 填写：向前翻页 ===================== */
const FLIP = { D: 1500, DEG: 104, BEND: 0.40, url: '', gl: null, tex: null, prog: null,
               buf: null, n: 72, ok: false, back: false };

let flipStart = 0;
let flipRAF = 0;
let flipping = false;

const clamp01 = v => Math.min(1, Math.max(0, v));
const easePage = p => p < .5 ? 4*p*p*p : 1 - Math.pow(-2*p + 2, 3) / 2;

/* ---------- WebGL 初始化 ---------- */
const VS = `
attribute vec2 a_pos; attribute vec2 a_uv; attribute float a_sh; attribute float a_bk;
uniform vec2 u_res;
varying vec2 v_uv; varying float v_sh; varying float v_bk;
void main(){
  vec2 p = a_pos / u_res * 2.0 - 1.0;
  gl_Position = vec4(p.x, -p.y, 0.0, 1.0);
  v_uv = a_uv; v_sh = a_sh; v_bk = a_bk;
}`;

const FS = `
precision mediump float;
uniform sampler2D u_tex;
varying vec2 v_uv; varying float v_sh; varying float v_bk;
void main(){
  vec3 c = texture2D(u_tex, v_uv).rgb;
  vec3 paper = vec3(0.993, 0.968, 0.977);
  vec3 base = mix(c, paper, clamp(v_bk, 0.0, 1.0));
  base *= mix(1.0, 0.93, clamp(v_bk, 0.0, 1.0));
  gl_FragColor = vec4(base * v_sh, 1.0);
}`;

function compile(gl, type, src){
  const sh = gl.createShader(type);
  gl.shaderSource(sh, src);
  gl.compileShader(sh);
  if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh));
  return sh;
}

function initCurl(){
  const cv = document.getElementById('curl');
  const gl = cv.getContext('webgl', { premultipliedAlpha: true, alpha: true });
  if (!gl) return false;
  const prog = gl.createProgram();
  gl.attachShader(prog, compile(gl, gl.VERTEX_SHADER, VS));
  gl.attachShader(prog, compile(gl, gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) return false;
  gl.useProgram(prog);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  FLIP.gl = gl; FLIP.prog = prog;
  FLIP.aPos = gl.getAttribLocation(prog, 'a_pos');
  FLIP.aUv = gl.getAttribLocation(prog, 'a_uv');
  FLIP.aSh = gl.getAttribLocation(prog, 'a_sh');
  FLIP.aBk = gl.getAttribLocation(prog, 'a_bk');
  FLIP.uRes = gl.getUniformLocation(prog, 'u_res');
  FLIP.uTex = gl.getUniformLocation(prog, 'u_tex');
  FLIP.bPos = gl.createBuffer(); FLIP.bUv = gl.createBuffer();
  FLIP.bSh = gl.createBuffer(); FLIP.bBk = gl.createBuffer();
  return true;
}

function uploadTexture(img){
  const gl = FLIP.gl;
  if (FLIP.tex) gl.deleteTexture(FLIP.tex);
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  FLIP.tex = tex;
}

/* ---------- 每帧几何：纸面绕脊线卷成圆柱再整体前翻 ---------- */
const _p = [], _u = [], _s = [], _b = [];

function drawCurl(p, deg, bend, rect, sp){
  const gl = FLIP.gl;
  if (!gl || !FLIP.tex) return;
  const cv = document.getElementById('curl');
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const vw = window.innerWidth, vh = window.innerHeight;
  if (cv.width !== Math.round(vw * dpr) || cv.height !== Math.round(vh * dpr)){
    cv.width = Math.round(vw * dpr); cv.height = Math.round(vh * dpr);
  }
  gl.viewport(0, 0, cv.width, cv.height);
  gl.clearColor(0, 0, 0, 0);
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.useProgram(FLIP.prog);

  const N = FLIP.n;
  const W = rect.W, H = rect.H;
  const theta = -deg * Math.PI / 180;          /* 负角 = 朝观者抬起 */
  const A = Math.max(bend, 0.02);
  const R = W / A;
  const D = 2100;                               /* 相机距离 */
  const cx = vw / 2, cy = vh / 2;
  const sx0 = rect.L;                           /* 脊线屏幕 x */

  _p.length = 0; _u.length = 0; _s.length = 0; _b.length = 0;
  const L = [-0.42, -0.32, 0.85];
  const ln = Math.hypot(L[0], L[1], L[2]);
  const Lx = L[0]/ln, Ly = L[1]/ln, Lz = L[2]/ln;

  for (let i = 0; i <= N; i++){
    const sPos = i / N * W;
    const phi = sPos / R;
    const bx = R * Math.sin(phi);
    const bz = R * (1 - Math.cos(phi));
    const x1 = bx * Math.cos(theta) + bz * Math.sin(theta);
    const z1 = -bx * Math.sin(theta) + bz * Math.cos(theta);
    const k = D / (D - z1);
    const px = cx + (sx0 + x1 - cx) * k;

    /* 法线（局部）→ 旋转 */
    const nl = [-Math.sin(phi), 0, Math.cos(phi)];
    const nx = nl[0] * Math.cos(theta) + nl[2] * Math.sin(theta);
    const nz = -nl[0] * Math.sin(theta) + nl[2] * Math.cos(theta);

    const diff = Math.max(0, nx*Lx + nz*Lz);
    const spec = Math.pow(Math.max(0, nz), 26) * diff * 0.85;
    const shade = 0.80 + 0.34 * diff + spec;
    const back = nz < 0 ? 1 : 0;

    for (let j = 0; j < 2; j++){
      const y = rect.T + j * H;
      const py = cy + (y - cy) * k;
      _p.push(px, py);
      _u.push(i / N, j);
      _s.push(Math.min(1.12, shade));
      _b.push(back);
    }
  }

  const set = (buf, loc, arr, size) => {
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(arr), gl.DYNAMIC_DRAW);
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, size, gl.FLOAT, false, 0, 0);
  };
  set(FLIP.bPos, FLIP.aPos, _p, 2);
  set(FLIP.bUv, FLIP.aUv, _u, 2);
  set(FLIP.bSh, FLIP.aSh, _s, 1);
  set(FLIP.bBk, FLIP.aBk, _b, 1);

  gl.uniform2f(FLIP.uRes, vw, vh);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, FLIP.tex);
  gl.uniform1i(FLIP.uTex, 0);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, (N + 1) * 2);
}

/* ---------- 时间函数 ---------- */
function applyFlip(t){
  const p = clamp01(t / FLIP.D);
  const e = easePage(p);
  const deg = FLIP.DEG * e;
  const bend = FLIP.BEND * Math.sin(Math.PI * clamp01(p * 1.02)) * (1 - 0.15 * p) + 0.02;

  const rect = FLIP.rect || { L: 0, T: 0, W: 300, H: 450 };
  drawCurl(p, deg, bend, rect, 0);

  /* 底层填写页 */
  const f = $('#s-form');
  f.style.opacity = String(clamp01(p * 7));
  f.style.transform = `scale(${(1.045 - 0.045 * clamp01(p * 1.4)).toFixed(4)})`;
  const head = f.querySelector('.fhead'), panel = f.querySelector('.panel');
  const kh = clamp01((p - 0.24) / 0.32), kp = clamp01((p - 0.34) / 0.36);
  head.style.opacity = kh.toFixed(3);
  head.style.transform = `translateY(${((1 - kh) * 16).toFixed(2)}px)`;
  panel.style.opacity = kp.toFixed(3);
  panel.style.transform = `translateY(${((1 - kp) * 22).toFixed(2)}px)`;

  /* 折边软影 */
  const edge = clamp01(Math.abs(Math.cos(deg * Math.PI / 180))) * 100;
  const castP = Math.sin(Math.PI * clamp01(p * 1.05));
  const cast = $('#cast');
  cast.style.opacity = (castP * 0.9).toFixed(3);
  cast.style.background =
    'linear-gradient(90deg,rgba(44,26,54,0) 0%,rgba(44,26,54,.02) ' + Math.max(0, edge - 4).toFixed(1) + '%,' +
    'rgba(44,26,54,.28) ' + Math.min(100, edge + 6).toFixed(1) + '%,' +
    'rgba(44,26,54,0) ' + Math.min(100, edge + 26).toFixed(1) + '%)';
  $('#spine').style.opacity = (clamp01(p * 6) * (1 - clamp01((p - 0.35) / 0.4)) * 0.9).toFixed(3);

  /* 尾段淡出（含 canvas） */
  const fade = p > 0.68 ? clamp01((0.96 - p) / 0.24) : 1;
  $('#flip').style.opacity = String(fade);
}

function finishFlip(){
  const flip = $('#flip'), f = $('#s-form');
  flip.classList.remove('on');
  flip.style.opacity = '';
  f.style.opacity = ''; f.style.transform = '';
  f.querySelectorAll('.fhead,.panel').forEach(el => { el.style.opacity = ''; el.style.transform = ''; });
  flipping = false;
}

function openInvitation(){
  if (flipping) return;
  const box = $('#posterBox');
  const flip = $('#flip');
  const W = box.offsetWidth, H = box.offsetHeight, L = box.offsetLeft, T = box.offsetTop;
  const img = document.querySelector('#posterBox img');

  FLIP.rect = { L, T, W, H };
  if (!FLIP.gl && !initCurl()) { /* 无 WebGL：保持空白，直接显示表单 */ }
  if (FLIP.gl){
    try { uploadTexture(img); } catch (e) {}
  }

  $('#cast').style.cssText = `position:absolute;top:${T}px;left:${L}px;width:${W}px;height:${H}px`;
  $('#spine').style.cssText = `position:absolute;top:${T}px;left:${L}px;height:${H}px`;

  flip.classList.add('on');
  const cover = $('#s-cover');
  cover.style.transition = 'none';
  cover.style.opacity = '0';

  show('s-form');
  const f = $('#s-form');
  f.style.transition = 'none';

  flipping = true;
  flipStart = performance.now();
  const tick = now => {
    const t = now - flipStart;
    applyFlip(t);
    if (t / FLIP.D < 0.99){ flipRAF = requestAnimationFrame(tick); }
    else { applyFlip(FLIP.D); finishFlip(); }
  };
  flipRAF = requestAnimationFrame(tick);

  window.__flipAt = t => { applyFlip(t); };
  window.__stopFlip = () => { cancelAnimationFrame(flipRAF); flipRAF = 0; };
  window.__endFlip = () => { applyFlip(FLIP.D); finishFlip(); };
  setTimeout(() => { try { $('#name').focus(); } catch (e) {} }, 1250);
}

/* ===================== 邀请函入场 ===================== */
function playCardIn(){
  const card = $('#cardImg'), shadow = $('#cardShadow'), glow = $('#cardGlow');
  const sheen = $('#sheen'), move = $('#sheenMove'), sparks = $('#sparks');

  [card, shadow, glow, sheen, move, sparks].forEach(e => e && e.getAnimations().forEach(a => a.cancel()));
  sparks.innerHTML = '';

  card.animate([
    { opacity: 0, transform: 'translateY(34px) scale(.958)' },
    { opacity: 1, transform: 'translateY(-6px) scale(1.005)', offset: .74 },
    { opacity: 1, transform: 'none' }
  ], { duration: 900, easing: 'cubic-bezier(.22,.72,.2,1)', fill: 'both' });

  shadow.animate([{ opacity: 0 }, { opacity: .5, offset: .55 }, { opacity: 1 }],
    { duration: 1050, easing: 'ease-out', fill: 'both' });

  glow.animate([
    { opacity: 0, transform: 'scale(.82)' },
    { opacity: .8, offset: .28 },
    { opacity: 0, transform: 'scale(1.16)' }
  ], { duration: 1500, delay: 180, easing: 'ease-out', fill: 'both' });

  sheen.animate([{ opacity: 0 }, { opacity: 1, offset: .25 }, { opacity: 1, offset: .78 }, { opacity: 0 }],
    { duration: 1700, delay: 520, fill: 'both' });
  move.animate([{ transform: 'translateX(-130%)' }, { transform: 'translateX(130%)' }],
    { duration: 1350, delay: 600, easing: 'cubic-bezier(.4,0,.5,1)', fill: 'both' });

  for (let i = 0; i < 14; i++){
    const dot = document.createElement('i');
    dot.className = 'spark';
    dot.style.left = '50%';
    dot.style.top = '50%';
    sparks.appendChild(dot);
    const ang = -Math.PI / 2 + (Math.random() - .5) * 2.6;
    const rad = 60 + Math.random() * 110;
    const dx = Math.cos(ang) * rad, dy = Math.sin(ang) * rad;
    const sc = .7 + Math.random() * .8;
    dot.animate([
      { transform: 'translate(-50%,-50%) scale(' + sc + ')', opacity: 0 },
      { transform: 'translate(calc(-50% + ' + (dx * .45) + 'px), calc(-50% + ' + (dy * .45) + 'px)) scale(' + sc + ')', opacity: .95, offset: .22 },
      { transform: 'translate(calc(-50% + ' + dx + 'px), calc(-50% + ' + dy + 'px)) scale(.2)', opacity: 0 }
    ], { duration: 900 + Math.random() * 400, delay: 620 + Math.random() * 180,
         easing: 'cubic-bezier(.2,.62,.3,1)', fill: 'both' });
  }
}

/* ==================================================================
   ====================  星球建设进度  ====================
   ================================================================== */
let pIndex = 0;          // 当前星球下标
let allLit = false;      // 是否全部点亮（进入星系模式）

const PLANET_NAMES = ['初啼','慢长','嬉游','好奇','无拘','启明','奔跑','远眺','朝露','萌芽','起跑','砺场','梦想','赴愿','镜界','夜航','候场','101','坚持','铭牌','BLANK2Y','REST','星闪','入戏','INUFF·新岸','启澜'];
function planetName(i){ const n = PLANET_NAMES[i] || ''; return 'No.' + (i + 1) + (n ? '  ' + n : ''); }
function isLit(i){ return Number(PLANETS[i]) === 100; }
function pctOf(i){ const v = Number(PLANETS[i]); return [0,25,50,75,100].includes(v) ? v : 0; }
function litCount(){ let n = 0; PLANETS.forEach((_, i) => { if (isLit(i)) n++; }); return n; }

/* 载入外部配置 planets.json（后台导出），失败则用内嵌默认 */
function loadPlanetConfig(){
  try {
    fetch('planets.json', { cache: 'no-store' })
      .then(r => r.ok ? r.json() : null)
      .then(cfg => {
        if (cfg && Array.isArray(cfg.planets) && cfg.planets.length){
          PLANETS = cfg.planets;
          if (document.getElementById('s-planets').classList.contains('active')) renderPlanets();
        }
      })
      .catch(() => {});
  } catch (e) {}
}

function buildStars(){
  const box = $('#planetStars');
  if (box.childElementCount) return;
  let html = '';
  for (let i = 0; i < 46; i++){
    const x = Math.random()*100, y = Math.random()*100;
    const s = (Math.random()*1.6 + .5).toFixed(2);
    const o = (Math.random()*.6 + .2).toFixed(2);
    const d = (Math.random()*4).toFixed(2);
    html += `<i class="g-spark" style="left:${x}%;top:${y}%;width:${s}px;height:${s}px;--td:${(2+Math.random()*3).toFixed(1)}s;--dl:${d}s;opacity:${o}"></i>`;
  }
  box.innerHTML = html;
}

function buildTrack(){
  const track = $('#track');
  track.innerHTML = '';
  PLANETS.forEach((p, i) => {
    const el = document.createElement('div');
    el.className = 'pitem';
    el.dataset.i = i;
    el.innerHTML = `<div class="orb">
      <i class="halo"></i>
      <img src="${PLANET_IMG}" alt="">
      <i class="ring"></i>
      <span class="lit-badge">✦ 已点亮</span>
    </div>`;
    track.appendChild(el);
  });
  // 圆点
  const dots = $('#planetDots');
  dots.innerHTML = PLANETS.map((_, i) => `<i data-i="${i}"></i>`).join('');
}

function layoutCarousel(){
  const items = $('#track').children;
  const N = items.length;
  for (let i = 0; i < N; i++){
    let diff = i - pIndex;
    // 环形最短距离
    if (diff > N/2) diff -= N;
    if (diff < -N/2) diff += N;
    const ad = Math.abs(diff);
    const el = items[i];
    const lit = isLit(i);
    // 中间大、两侧小
    let scale = 1, x = 0, opacity = 0, blur = 3, bright = .8, halo = 0, ring = 0, badge = 0, sat = .7, brt = .7, z = 1;
    if (ad === 0){
      scale = 1; x = 0; opacity = 1; blur = 0; bright = 1; z = 5;
      halo = lit ? 1 : .22; ring = lit ? .95 : .28; badge = lit ? 1 : 0; sat = lit ? 1.2 : .55; brt = lit ? 1.15 : 1.02;
    } else if (ad === 1){
      scale = .56; x = diff * 63; opacity = .5; blur = 1.4; bright = .92; z = 3;
      halo = lit ? .45 : .1; ring = lit ? .4 : .12; sat = lit ? .95 : .6; brt = lit ? .95 : .96;
    } else if (ad === 2){
      scale = .34; x = diff * 52; opacity = .24; blur = 2.4; bright = .78; z = 2;
      halo = lit ? .22 : 0; ring = 0; sat = .55; brt = .9;
    } else {
      scale = .2; x = diff > 0 ? 78 : -78; opacity = 0; blur = 3; z = 1;
    }
    el.style.setProperty('--x', x + '%');
    el.style.setProperty('--s', scale);
    el.style.setProperty('--o', opacity);
    el.style.setProperty('--b', blur + 'px');
    el.style.setProperty('--br', bright);
    el.style.setProperty('--z', z);
    el.style.setProperty('--dly', (i % 5 * -.6).toFixed(2) + 's');
    const orb = el.querySelector('.orb');
    orb.style.setProperty('--halo', halo);
    orb.style.setProperty('--ring', ring);
    orb.style.setProperty('--sat', sat);
    orb.style.setProperty('--brt', brt);
    const badgeEl = el.querySelector('.lit-badge');
    badgeEl.style.opacity = ad === 0 ? (lit ? 1 : 0) : 0;
  }
  // 名称与进度
  $('#planetName').textContent = planetName(pIndex);
  const pct = pctOf(pIndex);
  $('#progressFill').style.width = pct + '%';
  $('#progressText').textContent = pct + '%';
  // 圆点状态
  const dts = $('#planetDots').children;
  for (let i = 0; i < dts.length; i++){
    dts[i].classList.toggle('on', i === pIndex);
    dts[i].classList.toggle('lit', isLit(i));
  }
}

function renderPlanets(){
  allLit = litCount() === PLANETS.length && PLANETS.length > 0;
  if (allLit){
    $('#planetView').classList.remove('on');
    $('#galaxy').classList.add('on');
    buildGalaxy();
  } else {
    $('#galaxy').classList.remove('on');
    $('#planetView').classList.add('on');
    buildStars();
    buildTrack();
    layoutCarousel();
  }
}

function movePlanet(dir){
  const N = PLANETS.length;
  pIndex = (pIndex + dir + N) % N;
  layoutCarousel();
}

/* ============ 小星系：Canvas 倾斜星盘 ============ */
const GAL = { cv:null, ctx:null, raf:0, t0:0, suns:[], w:0, h:0, dpr:1, img:null, ready:false };

function galInit(){
  const cv = document.getElementById('galaxyCanvas');
  if (!cv) return null;
  if (!GAL.ctx){
    GAL.cv = cv;
    GAL.ctx = cv.getContext('2d');
    GAL.img = new Image();
    GAL.img.onload = () => { GAL.ready = true; };
    GAL.img.src = PLANET_IMG;
  }
  return cv;
}

function galLayout(){
  const stage = $('#galaxyStage');
  const cv = GAL.cv;
  if (!stage || !cv) return;
  const w = stage.clientWidth, h = stage.clientHeight;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  if (!w || !h) return;
  GAL.w = w; GAL.h = h; GAL.dpr = dpr;
  cv.width = Math.round(w * dpr);
  cv.height = Math.round(h * dpr);
  GAL.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

/* 构建星环数据：环数与每环数量按周长自适应，避免重叠 */
function galBuild(){
  const N = PLANETS.length;
  const ringN = N >= 20 ? 4 : N >= 12 ? 3 : N >= 5 ? 2 : 1;
  /* 环半径从 0.32 到 1.0，按半径比例分配数量（外环多） */
  const radii = [];
  for (let r = 0; r < ringN; r++)
    radii.push(ringN === 1 ? 0.66 : 0.32 + 0.68 * r / (ringN - 1));
  const weightSum = radii.reduce((a, b) => a + b, 0);
  const counts = radii.map(r => Math.max(2, Math.round(N * r / weightSum)));
  let diff = N - counts.reduce((a, b) => a + b, 0);
  let gi = counts.length - 1;
  while (diff !== 0){
    counts[gi] += diff > 0 ? 1 : -1;
    if (counts[gi] < 2){ counts[gi] += diff > 0 ? 1 : 1; }
    diff += diff > 0 ? -1 : 1;
    gi = gi === 0 ? counts.length - 1 : gi - 1;
  }

  const suns = [];
  for (let r = 0; r < ringN; r++){
    const count = counts[r];
    for (let k = 0; k < count; k++){
      suns.push({
        ring: r,
        rad: radii[r],
        a: (k / count) * Math.PI * 2 + r * 0.62,          // 每环错开，避免连成直线
        speed: (0.048 - r * 0.008) * (r % 2 ? -1 : 1),    // 交错转向，内快外慢
        size: 14.2 - r * 0.7,                             // 内环略大
        seed: Math.random() * 6.28
      });
    }
  }
  GAL.suns = suns;
}

function galDraw(now){
  const ctx = GAL.ctx;
  if (!ctx) return;
  const t = (now - GAL.t0) / 1000;
  const w = GAL.w, h = GAL.h;
  if (!w || !h) return;
  ctx.clearRect(0, 0, w, h);

  const cx = w / 2, cy = h * 0.48;
  const tilt = 0.58;
  const maxR = Math.min(cx * 0.96, (cy * 0.92) / tilt);

  /* 中心霞光 */
  const halo = ctx.createRadialGradient(cx, cy, 0, cx, cy, maxR * 0.62);
  halo.addColorStop(0, 'rgba(206,160,255,.24)');
  halo.addColorStop(.5, 'rgba(150,105,225,.095)');
  halo.addColorStop(1, 'rgba(110,70,180,0)');
  ctx.fillStyle = halo;
  ctx.fillRect(0, 0, w, h);

  /* 轨道椭圆：极淡 */
  const ringsSeen = [...new Set(GAL.suns.map(s => s.ring))];
  ringsSeen.forEach(r => {
    const rad = maxR * GAL.suns.find(s => s.ring === r).rad;
    ctx.beginPath();
    ctx.ellipse(cx, cy, rad, rad * tilt, 0, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(226,205,255,.10)';
    ctx.lineWidth = 1;
    ctx.stroke();
  });

  /* 星球：按深度排序，远→近 */
  const drawables = GAL.suns.map(s => {
    const ang = s.a + t * s.speed;
    const rad = maxR * s.rad;
    return {
      s,
      x: cx + Math.cos(ang) * rad,
      y: cy + Math.sin(ang) * rad * tilt,
      depth: Math.sin(ang)
    };
  }).sort((a, b) => a.depth - b.depth);

  drawables.forEach(d => {
    const k = (d.depth + 1) / 2;
    const size = d.s.size * (0.72 + 0.42 * k);
    const alpha = 0.38 + 0.58 * k;
    const bob = Math.sin(t * 1.4 + d.s.seed) * 1.1;

    const g = ctx.createRadialGradient(d.x, d.y + bob, 0, d.x, d.y + bob, size * 2.7);
    g.addColorStop(0, `rgba(255,216,255,${0.40 * alpha})`);
    g.addColorStop(.40, `rgba(198,132,255,${0.17 * alpha})`);
    g.addColorStop(1, 'rgba(150,90,220,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(d.x, d.y + bob, size * 2.7, 0, Math.PI * 2);
    ctx.fill();

    if (GAL.ready){
      ctx.globalAlpha = alpha;
      ctx.drawImage(GAL.img, d.x - size, d.y + bob - size, size * 2, size * 2);
      ctx.globalAlpha = 1;
    } else {
      ctx.fillStyle = `rgba(238,204,255,${alpha})`;
      ctx.beginPath();
      ctx.arc(d.x, d.y + bob, size, 0, Math.PI * 2);
      ctx.fill();
    }
  });

  /* 中心核 */
  const core = ctx.createRadialGradient(cx, cy, 0, cx, cy, 24);
  core.addColorStop(0, 'rgba(255,255,255,.95)');
  core.addColorStop(.32, 'rgba(246,216,255,.7)');
  core.addColorStop(1, 'rgba(200,140,255,0)');
  ctx.fillStyle = core;
  ctx.beginPath();
  ctx.arc(cx, cy, 24, 0, Math.PI * 2);
  ctx.fill();

  GAL.raf = requestAnimationFrame(galDraw);
}

function buildGalaxy(){
  const cv = galInit();
  if (!cv) return;
  galLayout();
  galBuild();
  cancelAnimationFrame(GAL.raf);
  GAL.t0 = performance.now();
  GAL.raf = requestAnimationFrame(galDraw);
}

window.addEventListener('resize', () => {
  if ($('#galaxy') && $('#galaxy').classList.contains('on')){
    galLayout();
    galBuild();
  }
});

/* 入口：进入星球页 */
$('#openPlanets').addEventListener('click', () => {
  pIndex = 0;
  renderPlanets();
  show('s-planets');
});
$('#planetBack').addEventListener('click', () => { show('s-card'); });
$('#galaxyBack').addEventListener('click', () => { show('s-card'); });

/* 左右滑动 / 拖拽 / 键盘 */
(function(){
  const car = $('#carousel');
  let sx = 0, dragging = false, moved = false;
  const down = x => { sx = x; dragging = true; moved = false; };
  const up = x => {
    if (!dragging) return;
    dragging = false;
    const dx = x - sx;
    if (Math.abs(dx) > 34){ movePlanet(dx < 0 ? 1 : -1); moved = true; }
  };
  car.addEventListener('touchstart', e => down(e.touches[0].clientX), {passive:true});
  car.addEventListener('touchend', e => up(e.changedTouches[0].clientX), {passive:true});
  car.addEventListener('mousedown', e => down(e.clientX));
  window.addEventListener('mouseup', e => up(e.clientX));
  window.addEventListener('keydown', e => {
    if (!$('#s-planets').classList.contains('active') || allLit) return;
    if (e.key === 'ArrowLeft') movePlanet(-1);
    if (e.key === 'ArrowRight') movePlanet(1);
  });
})();

/* 初始化 */
fitPoster();
setTimeout(fitPoster, 300);
loadPlanetConfig();
$('#openPlanets').style.display = 'none';   // 封面页先隐藏
</script>
